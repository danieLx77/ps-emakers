version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ps-emakers-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ps_emakers-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emakers-network

  api:
    build: .
    container_name: ps-emakers-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-ps_emakers-db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET: ${SECRET:-senhasecreta}
    networks:
      - emakers-network

volumes:
  postgres_data:

networks:
  emakers-network:
    driver: bridge